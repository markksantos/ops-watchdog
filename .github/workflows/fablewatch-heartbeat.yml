name: FableWatch heartbeat

# Moved out of markksantos/fablewatch on 2026-08-20, unchanged in behaviour.
#
# It is a dead-man's-switch for FableWatch's primary cron, and on 2026-08-19 it
# died for the dumbest possible reason: it shared a metered Actions minute pool
# with every other private repo, that pool ran dry, and the account's $0 Actions
# budget refused to start it. A monitor that fails silently when the account is
# busy is not a monitor. Both halves are external HTTP calls, so they belong here
# where minutes are unmetered.
#
#   1. DEAD-MAN'S-SWITCH - GET the public /api/health. Failing step -> GitHub
#      emails the repo owner.
#   2. BACKUP TICK - drive /api/cron/tick so detection/notify/reap limp along at
#      30-min granularity if the primary is down. Skips cleanly with no secret.
#
# Order matters: health is read BEFORE our own tick, so it reflects the PRIMARY
# cron's health rather than our tick refreshing it.
#
# READ THIS BEFORE TRUSTING THIS WORKFLOW (established 2026-08-20):
# Half 1 is currently GREEN BY CONSTRUCTION and is NOT coverage. /api/health answers
# {"ok":true,"db":false,"note":"no database configured"} - HTTP 200 unconditionally -
# so the dead-man's-switch cannot fail no matter what breaks.
#
# This is NOT a regression and must NOT be "fixed" by making /api/health 503 on stale.
# docs/DE-NEON-2026-07-21.md in the fablewatch repo deliberately retired the Fable
# return-monitor subsystem: DATABASE_URL was removed from every Vercel env, and the
# dbReady() guards make the monitor no-op by design. A 503-on-stale would page forever
# about a subsystem that was switched off on purpose.
#
# The real defect is that this ALARM outlived the subsystem it watched. Keep the
# workflow (the backup tick half still does real work) but do not count half 1 as
# monitoring. A genuine proof-of-life would have to watch the freshness of something
# the tick actually writes to Blob, read by CDN HEAD to respect the zero-metered-ops
# invariant in blobstore.ts. No such public surface exists yet (/api/aw/liveness 404s,
# /api/social-proof carries no timestamps) and /api/status is not a substitute - its
# fallbackStatus() stamps checkedAt with now() on every call, so it always looks fresh.
# That design call is Mark's, not this file's.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: fablewatch-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Dead-man's-switch — alert if the monitor poll is stale
        run: |
          check() { curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://fablewatch.com/api/health; }
          code=$(check)
          # One retry to avoid flapping on a transient network/edge blip.
          if [ "$code" != "200" ]; then
            echo "health first read: HTTP $code — retrying in 20s…"
            sleep 20
            code=$(check)
          fi
          echo "health: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error title=FableWatch heartbeat::/api/health returned $code — the monitor poll is STALE. The primary cron is likely down. Return detection, notifications, and VPS reaping are NOT running. Investigate now."
            exit 1
          fi
          echo "Primary cron healthy."

      # This step is now the ONLY half that can actually fail, so it has to mean
      # something. It used to send the body to /dev/null and print the status
      # without ever failing - a 401, a 500, or an ok:false body all looked
      # identical to success. Now the status and the body are both asserted.
      - name: Backup heartbeat — drive the cron tick, and assert it worked
        if: always()
        run: |
          set -uo pipefail
          if [ -z "${{ secrets.FABLEWATCH_CRON_SECRET }}" ]; then
            echo "::error title=FableWatch heartbeat::FABLEWATCH_CRON_SECRET is missing — the backup tick cannot run and this workflow is monitoring nothing."
            exit 1
          fi
          code=$(curl -s -X GET https://fablewatch.com/api/cron/tick \
            -H "Authorization: Bearer ${{ secrets.FABLEWATCH_CRON_SECRET }}" \
            --max-time 280 -o /tmp/tick.json -w "%{http_code}")
          echo "backup tick: HTTP $code"
          # This is a PUBLIC repo, so the authenticated endpoint's response body is
          # only printed when something is wrong and the detail is worth the
          # disclosure. It is counters today, but do not routinely publish the
          # internals of an authed route to a world-readable log.
          if [ "$code" != "200" ] || ! grep -q '"ok":true' /tmp/tick.json; then
            echo "--- body (failure detail) ---"
            head -c 2000 /tmp/tick.json || true
            echo
          fi
          if [ "$code" != "200" ]; then
            echo "::error title=FableWatch heartbeat::/api/cron/tick returned $code. ArtificialWatch launch detection, fan-out, liveness probes and store-health paging all run inside this tick — none of them are running."
            exit 1
          fi
          # The route answers 200 with {"ok":true,...}; ok:false means a subsystem
          # aborted the request even though the HTTP layer was fine.
          if ! grep -q '"ok":true' /tmp/tick.json; then
            echo "::error title=FableWatch heartbeat::/api/cron/tick answered 200 but the body is not ok:true — a subsystem inside the tick failed."
            exit 1
          fi
          echo "Tick ran and reported ok."
